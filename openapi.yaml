                            session_token: tok_butter_b
                            num_units_to_buy: 1
                    missing_items: [onion powder]
                    currency: GBP

  /search:
    post:
      tags: [Cart]
      summary: Start a broad asynchronous product search
      description: |
        `/search` and `/products` both turn a product request into real supermarket
        products. `/products` reads Pepesto's daily cache of the 1,000–2,000 SKUs people
        cook with, so it answers immediately. `/search` looks at the whole store — wine,
        cosmetics, ready meals, anything outside that cache — which is why it runs
        asynchronously, takes longer, and costs more.

        The call returns a `search_session_id` right away. Results are usually ready
        within ten minutes, and heavy traffic can stretch that. Either poll `/retrieve`
        with the id, or pass `webhook_url` and Pepesto will POST to it as soon as the
        results are ready, with the session id appended as the `sid` query parameter.

        A search session and its results are kept for 14 days and then permanently
        deleted, so store anything you need on your own side.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              withWebhook:
                summary: Search Coop CH and get called back when it is done
                value:
                  product: organic strawberries 500g
                  supermarket_domain: coop.ch
                  webhook_url: https://example.com/hooks/pepesto-search
              polling:
                summary: Search and poll /retrieve instead
                value:
                  product: alcohol-free lager, 6-pack
                  supermarket_domain: tesco.com
      responses:
        "200":
          description: Search accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                accepted:
                  value:
                    search_session_id: srch_01HZAB7WK4

  /retrieve:
    post:
      tags: [Cart]
      summary: Check and collect an asynchronous search
      description: |
        Reports where a search started with `/search` has got to, and returns the matched
        products once it is finished. Poll until `status` is `done`. Free.
      operationId: retrieveSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
            examples:
              basic:
                value:
                  search_session_id: srch_01HZAB7WK4
      responses:
        "200":
          description: Current state of the search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
              examples:
                stillRunning:
                  summary: Not ready yet — poll again
                  value:
                    status: in_progress
                done:
                  summary: Finished, with one entry per requested item
                  value:
                    status: done
                    currency: CHF
                    items:
                      - item_name: organic strawberries 500g
                        products:
                          - product:
                              product_name: Coop Naturaplan Bio-Erdbeeren 500g
                              category: berries
                              quantity: { grams: 500 }
                              price:
                                price: 695
                              product_id: https://www.coop.ch/de/lebensmittel/p/5904321
                              classification: { is_bio: true }
                              session_token: tok_strawberries_a
                            session_token: tok_strawberries_a
                            num_units_to_buy: 1

  /session:
    post:
      tags: [Checkout]
      summary: Create a checkout session
      description: |
        Wraps a final basket as a session for the chosen supermarket. The returned
        `session_id` is what you feed to `/checkout` to drive the supermarket's own
        site.

        Provide `skus` (resolved tokens from `/products`), `unresolved_items` (free-text
        items the checkout agent will search for at run time), or both.

        Set `charge_user: true` to bill the end user directly via a hosted Pepesto
        payment link instead of consuming this API key's credits — see the
        `chargeUserCheckout` example.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
            examples:
              fromProducts:
                summary: Build a session from resolved /products tokens
                value:
                  supermarket_domain: coop.ch
                  skus:
                    - session_token: eyJwcm9kdWN0X2lkIjogImh0dHBzOi8vY29vcC5jaC9wYXN0YS8xMjMifQ==
                      num_units_to_buy: 1
                    - session_token: eyJwcm9kdWN0X2lkIjogImh0dHBzOi8vY29vcC5jaC90b21hdG9lcy80NTYifQ==
                      num_units_to_buy: 2
              withUnresolvedItems:
                summary: Mix resolved tokens with free-text items the agent will find at checkout
                value:
                  supermarket_domain: sainsburys.co.uk
                  skus:
                    - session_token: tok_butter_a
                      num_units_to_buy: 1
                  unresolved_items: ["sourdough loaf", "bunch of mint"]
              chargeUserCheckout:
                summary: Charge the end user directly with a £2.00 referrer markup
                value:
                  supermarket_domain: sainsburys.co.uk
                  skus:
                    - session_token: tok_butter_a
                      num_units_to_buy: 1
                  charge_user: true
                  charge_user_amount: 2.00
                  charge_user_webhook: https://yourapp.example.com/hooks/pepesto/session-ready
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              examples:
                created:
                  summary: Standard creation — session ready immediately
                  value:
                    session_id: sess_01HZAB7WK4
                chargeUserPending:
                  summary: charge_user flow — redirect the user to complete payment
                  value:
                    session_id: sess_01HZAB7WK4
                    payment_redirect_url: https://pay.pepesto.com/p/eyJzZXNzaW9uX2lkIjoic2Vzc18wMUhaQUI3V0s0In0=

  /checkout:
    post:
      tags: [Checkout]
      summary: One iteration of the automated-checkout loop
      description: |
        Drives one step of the AI-guided checkout loop. Each call returns a
        single instruction wrapped in `proto` for the client to execute — the
        instruction kind depends on what surface is driving the loop (browser
        running JS, iOS app, server-side agent, chat surface, …). Send the
        outcome back as `prev_turn_response` (plus an optional screenshot) to
        advance the session.

        The session must already exist — clients never create one via this API.
        Obtain `continue_session_id` from `/session` or the Pepesto app and echo
        it on every subsequent request for the same session.
      operationId: checkoutIteration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            examples:
              firstTurn:
                summary: Kick off the loop — no prior turn yet
                value:
                  continue_session_id: sess_01HZAB7WK4
              afterTurnSuccess:
                summary: Return the previous turn's result (success)
                value:
                  continue_session_id: sess_01HZAB7WK4
                  prev_turn_response:
                    result: "0.4137298732419"
                    error: ""
              afterTurnFailureWithScreenshot:
                summary: Previous turn failed; attach a screenshot the server requested
                value:
                  continue_session_id: sess_01HZAB7WK4
                  prev_turn_response:
                    result: ""
                    error: "Timeout: execution exceeded 5000ms"
                  screenshot: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkAAIAAAoAAv/lxKUAAAAASUVORK5CYII=
      responses:
        "200":
          description: Next instruction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
              examples:
                runJs:
                  summary: Browser-style JS instruction (one possible turn kind)
                  value:
                    proto:
                      session_id: sess_01HZAB7WK4
                      attach_screenshot_on_next_turn: false
                      run_js:
                        js: |
                          async function sleepAndReturnRandomNumber() {
                            await new Promise((resolve) => setTimeout(resolve, 1200));
                            return String(Math.random());
                          }
                        func: sleepAndReturnRandomNumber
                        max_execute_time_msec: 5000
                runJsWithScreenshot:
                  summary: Same, but the server wants a screenshot back next turn
                  value:
                    proto:
                      session_id: sess_01HZAB7WK4
                      attach_screenshot_on_next_turn: true
                      run_js:
                        js: |
                          function readCartTotal() {
                            return document.querySelector('[data-testid=cart-total]')?.textContent ?? '';
                          }
                        func: readCartTotal
                        max_execute_time_msec: 0

  /mcheckout:
    post:
      tags: [Checkout]
      summary: Hand the checkout loop to the Pepesto app
      description: |
        Takes the same request as `/session`, but instead of a session you drive yourself
        it returns a deferred deep link to the Pepesto mobile app. The app opens if it is
        installed, otherwise the user is sent to the App Store or Google Play. It then
        runs the checkout loop, fills the basket with the SKUs you passed, and returns
        the user to your `redirect_url` with the supermarket cart URL appended as the
        escaped `cartUrl` query parameter. Without a `redirect_url` the user is left on
        the supermarket's own cart or login page.

        Your user stays your user. The app remembers that they arrived through an
        integrated client and stays locked to checkout — meal planning, recipe search and
        promotions are not available, and it stays that way if they open the app again
        later.
      operationId: mcheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
            examples:
              basketWithReturnUrl:
                summary: Two Coop CH SKUs, with a return URL
                value:
                  supermarket_domain: coop.ch
                  redirect_url: https://example.com/checkout-complete
                  skus:
                    - session_token: eyJwcm9kdWN0X2lkIjogImh0dHBzOi8vY29vcC5jaC9wYXN0YS8xMjMifQ==
                      num_units_to_buy: 1
                    - session_token: eyJwcm9kdWN0X2lkIjogImh0dHBzOi8vY29vcC5jaC90b21hdG9lcy80NTYifQ==
                      num_units_to_buy: 2
      responses:
        "200":
          description: Deep link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              examples:
                created:
                  summary: Send the user to mobile_hosted_url
                  value:
                    session_id: sess_01HZAB7WK4
                    mobile_hosted_url: https://s.pepesto.com/m/eyJzZXNzaW9uX2lkIjoic2Vzc18wMUhaQUI3V0s0In0=

  /catalog:
    post:
      tags: [Catalog]
      summary: Full SKU dump for a supermarket
      description: |
        Returns Pepesto's full indexed catalog for a supermarket — typically
        1,000–2,000 SKUs of common cooking ingredients keyed by their canonical
        URL on the supermarket's site.

        Use this only for genuine market analysis or storefront builds; for normal
        recipe-to-cart flows, prefer `/oneshot` or `/products`. **Cache results
        aggressively** — at most one call per day per supermarket is recommended.
      operationId: catalogDump
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogRequest"
            examples:
              coopCh:
                summary: Coop CH catalog
                value:
                  supermarket_domain: coop.ch
              ahNl:
                summary: Albert Heijn (AH) catalog
                value:
                  supermarket_domain: ah.nl
      responses:
        "200":
          description: Full catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
              examples:
                ahNlSample:
                  summary: Truncated AH NL response — varied unit kinds, tags, and a promo
                  value:
                    parsed_products:
                      https://www.ah.nl/producten/product/wi100232/ah-rode-druiven-pitloos:
                        entity_name: Grapes
                        names:
                          en: AH Red seedless grapes
                          nl: AH Rode druiven pitloos
                        price: 279
                        currency: EUR
                        quantity_str: 500g
                        quantity:
                          Unit: { HundredGrams: 5 }
                          accurate_grams: 500
                      https://www.ah.nl/producten/product/wi101130/ah-biologisch-komkommer:
                        entity_name: Cucumbers
                        tags: [bio]
                        names:
                          en: AH Organic cucumber
                          nl: AH Biologisch Komkommer
                        price: 179
                        currency: EUR
                        promo: true
                        quantity_str: 1 piece
                        quantity:
                          Unit: { Pieces: 1 }
                      https://www.ah.nl/producten/product/wi101170/ah-biologisch-mai%CC%88skorrels:
                        entity_name: Canned corn
                        tags: [bio, canned]
                        names:
                          en: AH Organic corn kernels
                          nl: AH Biologisch Maïskorrels
                        price: 149
                        currency: EUR
                        quantity_str: 340g
                        quantity:
                          Unit: { HundredGrams: 3 }
                          accurate_grams: 340
                      https://www.ah.nl/producten/product/wi101200/ah-biologisch-natuurazijn:
                        entity_name: Vinegar
                        tags: [bio]
                        names:
                          en: AH Organic natural vinegar
                          nl: AH Biologisch Natuurazijn
                        price: 99
                        currency: EUR
                        quantity_str: 1 l
                        quantity:
                          Unit: { Milliliters: 1000 }

  /promotions:
    post:
      tags: [Catalog]
      summary: Promotional products for a supermarket
      description: |
        Returns the subset of the catalog currently on promotion — same shape as
        `/catalog` but filtered to entries with `promo: true`. Convenient when
        you only care about discounted SKUs (price-tracker, deal scanner, etc.)
        without paying for the full `/catalog` dump.
      operationId: promotions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionsRequest"
            examples:
              coopCh:
                summary: Coop CH promotions
                value:
                  supermarket_domain: coop.ch
      responses:
        "200":
          description: Promotional product list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionsResponse"
              examples:
                coopChSample:
                  summary: Truncated Coop CH response — pumpkin seeds + a few tortillas
                  value:
                    parsed_products:
                      https://www.coop.ch/de/lebensmittel/brot-backwaren/cracker-knaeckebrot/cracker/gewuerzt/dar-vida-naturaplan-kuerbiskerne-4-portionen/p/5909397:
                        entity_name: Pumpkin seeds
                        tags: [bio]
                        names:
                          de: Dar-Vida Naturaplan Kürbiskerne, 4 Portionen
                          en: Dar-Vida Naturaplan pumpkin seeds, 4 portions
                        self_hosted_image: https://storage.googleapis.com/pepesto_recipe_images/536135b744b1ac17fcea9cb597.webp
                        price: 395
                        currency: CHF
                        promo: true
                        price_per_meausure_unit: "2.15 CHF / 100g"
                        quantity_str: 184g
                        quantity:
                          Unit: { HundredGrams: 1 }
                          accurate_grams: 184
                      https://www.coop.ch/de/lebensmittel/brot-backwaren/haltbare-brote/fladenbrote-tortillas/old-el-paso-flour-tortillas-8-stueck/p/3021010:
                        entity_name: Tortillas
                        names:
                          de: Old El Paso Flour Tortillas 8 Stück
                          en: Old El Paso Flour Tortillas 8 pieces
                        self_hosted_image: https://storage.googleapis.com/pepesto_recipe_images/d85f992c81741f6c9f81c5e8b5.webp
                        price: 455
                        currency: CHF
                        promo: true
                        price_per_meausure_unit: "1.40 / 100g"
                        quantity_str: 8 pieces
                        quantity:
                          Unit: { Pieces: 8 }
                      https://www.coop.ch/de/lebensmittel/brot-backwaren/haltbare-brote/fladenbrote-tortillas/old-el-paso-street-market-corn-tortillas-glutenfrei-10-stueck/p/5892883:
                        entity_name: Tortillas
                        tags: [gluten-free]
                        names:
                          de: Old El Paso Street Market Corn Tortillas glutenfrei 10 Stück
                          en: Old El Paso Street Market Corn Tortillas gluten-free 10 pieces
                        self_hosted_image: https://storage.googleapis.com/pepesto_recipe_images/77634505be5c54fd476aa3f4ec.webp
