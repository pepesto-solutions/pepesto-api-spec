openapi: 3.0.3
info:
  title: Pepesto Grocery API
  version: "1.0.0"
  description: |
    Recipe → matched grocery cart across 28 European supermarkets.

    The Pepesto Grocery API turns a recipe (URL, free-form text, or image) into a matched
    basket of real supermarket products with live prices, across 28 European supermarkets in
    13 countries. It also exposes the recipe knowledge graph, full catalog dumps, promotional
    SKUs, a broad asynchronous product search, and a session/checkout pair for driving
    automated cart fill on the supermarket's own site.

    ## Authentication

    All endpoints except `POST /link` and `POST /predirect` require a Bearer token in the
    `Authorization` header:

    ```
    Authorization: Bearer pep_sk_…
    ```

    Mint a key by calling `POST /link` with the email address you used at checkout. The key
    is returned **only once** — store it immediately. See
    <https://www.pepesto.com/ai-grocery-shopping-agent/> for the full setup guide.

    ## Pricing model

    A monthly subscription turns into credits on your API key, and every call draws those
    credits down at that endpoint's rate. Unused credits roll over and never expire.
    `POST /link`, `POST /credits`, `POST /checkout`, `POST /retrieve` and `POST /predirect`
    cost nothing. Per-call prices live at <https://www.pepesto.com/pricing/>.

    ## Common shapes

    - **Prices** are integers in the smallest currency unit (e.g. cents, pence, øre).
    - **`KgToken`** is an opaque recipe handle returned by `/parse` and `/suggest` that you
      pass to `/products` to map ingredients to real SKUs.
    - **`session_token`** is a per-product handle from `/products` you pass to `/session`
      or `/mcheckout`.
    - **Currencies**: EUR, GBP, CHF, NOK, PLN, BGN, DKK, SEK.

    ## Reference implementations

    - MCP server: <https://github.com/pepesto-solutions/pepesto-mcp>
    - Code examples, one per use case: <https://github.com/pepesto-solutions/api-examples>
  contact:
    name: Pepesto
    url: https://www.pepesto.com/contact
  x-logo:
    url: https://www.pepesto.com/favicon.ico

servers:
  - url: https://s.pepesto.com/api
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Account
    description: API-key provisioning and credit balance.
  - name: Recipes
    description: Parse and search recipes; produces `KgToken`s.
  - name: Cart
    description: Map recipes/ingredients to real supermarket products and build carts.
  - name: Checkout
    description: Drive the supermarket's own site to fill the basket end-to-end.
  - name: Catalog
    description: Full and promotional product dumps for a given supermarket.

paths:
  /link:
    post:
      tags: [Account]
      summary: Mint an API key
      description: |
        Creates an API key linked to a previously completed Stripe payment. The key is
        returned **only once** — store it immediately. Pass an optional `alias` when you
        need multiple keys for the same email (e.g. one per environment).
      operationId: createApiKey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
            examples:
              basic:
                summary: Mint a single key
                value:
                  email: you@example.com
              aliased:
                summary: Mint a named key
                value:
                  email: you@example.com
                  alias: production
      responses:
        "200":
          description: API key created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"

  /credits:
    post:
      tags: [Account]
      summary: Check remaining credits
      description: Returns the remaining credit balance for the configured API key.
      operationId: getCredits
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Credit balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsResponse"

  /oneshot:
    post:
      tags: [Cart]
      summary: One-shot recipe → checkout-ready cart
      description: |
        Combines parse + product matching + session creation in a single call. Pass any
        combination of recipe URLs, free-form shopping text, and/or a base64-encoded image,
        plus a target supermarket. Returns a `redirect_url` that opens the Pepesto checkout
        UI with the matched cart pre-filled.

        Use this for the simplest end-to-end flow. Use `/parse` + `/products` + `/session`
        for finer control over individual steps.
      operationId: oneshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneshotRequest"
            examples:
              recipeUrlPlusExtras:
                summary: Recipe URL + extra free-text items at Tesco
                value:
                  content_urls:
                    - https://www.bbcgoodfood.com/recipes/pizza-margherita-4-easy-steps
                  content_text: "also add sparkling water and olive oil"
                  supermarket_domain: tesco.com
              shoppingListOnly:
                summary: Plain shopping list at Coop CH
                value:
                  content_text: "milk, bananas, sourdough bread, olive oil"
                  supermarket_domain: coop.ch
      responses:
        "200":
          description: Checkout-ready redirect URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneshotResponse"
              examples:
                redirect:
                  summary: Pepesto-hosted result page
                  value:
                    redirect_url: https://app.pepesto.com/composed?force=1&req=GigKJmFsc28g

  /predirect:
    post:
      tags: [Cart]
      summary: Hand a shopping list to the Pepesto app
      description: |
        Ends up in the same place as `/oneshot` — a shopping list becomes a matched
        basket and Pepesto takes the user through checkout — but the work happens later
        and the end user pays for it. The call returns a deferred deep link straight
        away; parsing and product matching only run once the user opens that link. If
        the app is not installed the user is sent to the App Store or Google Play first,
        and the shopping list is held until the app opens.

        Free to the API client, and public: no API key is required.
      operationId: predirect
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredirectRequest"
            examples:
              basic:
                summary: A three-line shopping list
                value:
                  shopping_list: "2 avocados\n1 loaf of bread\n500 g tomatoes"
      responses:
        "200":
          description: Deep link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredirectResponse"
              examples:
                created:
                  summary: Deferred deep link to the Pepesto app
                  value:
                    redirect_url: https://s.pepesto.com/d/eyJzaG9wcGluZ19saXN0X2lkIjoibHN0XzAxSFpBQjdXSzQifQ==

  /parse:
    post:
      tags: [Recipes]
      summary: Parse a recipe into structured ingredients
      description: |
        Extracts a structured recipe (title, ingredients, steps, nutrition, image) from a
        URL or free-form text. Returns a `kg_token` you can pass to `/products` to match
        ingredients to real SKUs.

        Provide exactly one of `recipe_url` or `recipe_text`.
      operationId: parseRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
            examples:
              fromUrl:
                summary: Parse from a recipe URL
                value:
                  recipe_url: https://www.bbcgoodfood.com/recipes/pizza-margherita-4-easy-steps
                  locale: en-GB
                  generate_image: false
              fromText:
                summary: Parse from free-form text
                value:
                  recipe_text: |
                    Carbonara for 2: 200g spaghetti, 100g guanciale, 2 eggs,
                    50g pecorino, black pepper.
                  locale: en-GB
      responses:
        "200":
          description: Structured recipe + `kg_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResponse"
              examples:
                pizzaMargherita:
                  summary: Pizza Margherita parsed from a recipe URL
                  value:
                    recipe:
                      title: Pizza Margherita
                      ingredients:
                        - 300g flour
                        - 1tsp yeast
                        - salt
                        - olive oil
                        - tomato sauce
                        - basil
                        - 1 garlic clove
                        - 130g mozzarella cheese
                        - parmesan cheese
                        - 100g cherry tomatoes
                      steps:
                        - "To make the base, combine the flour, yeast, and salt in a large bowl. Make a well in the center and pour in 200ml of warm water and the olive oil. Mix until a soft dough forms, then knead on a lightly floured surface for 5 minutes until smooth. Cover and set aside."
                        - "For the sauce, mix the passata, basil, and crushed garlic together, and season to taste."
                        - "Divide the dough into two balls. On a floured surface, roll each ball into a large, thin round, about 25cm across."
                        - "Preheat the oven to 240°C (220°C fan/gas 8) with a baking sheet on the top shelf. Spread the sauce over the pizza bases. Scatter with cheese and tomatoes, drizzle with olive oil, and season."
                        - "Place one pizza on its baking sheet onto the preheated sheet in the oven. Bake for 8-10 minutes until crisp. Serve with a drizzle of olive oil and basil leaves, if using. Repeat with the remaining pizza."
                      image_url: https://storage.googleapis.com/pepesto_recipe_images/placeholder.webp
                      nutrition:
                        calories: 1773
                        carbohydrates_grams: 244
                        protein_grams: 70
                        fat_grams: 52
                      portions:
                        from: 0
                        to: 0
                      kg_token: EhIKEFBpenp

  /suggest:
    post:
      tags: [Recipes]
      summary: Search the recipe knowledge graph
      description: |
        Searches Pepesto's recipe graph (1M+ recipes) by free-text query. The query may
        include cuisine, dietary tags, ingredients to include or avoid, time constraints,
        and servings (e.g. "vegan keto dinner low on carb for two"). Always returns 3
        recipes plus a short natural-language reply; each recipe includes a `kg_token`
        you can pass to `/products`.

        Returned images are licensed for display in your app or website without
        attribution.
      operationId: suggestRecipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestRequest"
            examples:
              keto:
                summary: Keto dinner, low-carb, high-protein
                value:
                  query: "Find me a keto dinner low on carb and high on protein"
              veganQuick:
                summary: Quick vegan pasta for two
                value:
                  query: "vegan pasta dinner for two, ready in 20 minutes"
              personalised:
                summary: Personalised query — German, 2 portions, prefer Coop CH
                value:
                  query: "easy weeknight dinner"
                  personalization:
                    locale: de-DE
                    portions: 2
                    supermarket_domain: coop.ch
      responses:
        "200":
          description: 3 matching recipes plus `short_response`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
              examples:
                ketoDinners:
                  summary: Three keto dinners returned for a low-carb / high-protein query
                  value:
                    recipes:
                      - title: Smoked Salmon Keto Pinwheels
                        ingredients:
                          - 1/8 lemon
                          - 1 garlic clove
                          - dill
                          - 110g cream cheese
                          - parmesan cheese
                          - 700g salmon fillet (~3)
                          - olive oil
                          - smoked paprika
                          - salt
                          - black pepper
                        steps:
                          - "Preheat oven to 200C and grease a baking dish."
                          - "Mix cream cheese, parmesan, garlic, herbs, lemon zest, salt, and pepper until smooth."
                          - "Spread the cream cheese mixture evenly over thin salmon slices."
                          - "Roll up the salmon slices tightly into pinwheels and place in the baking dish."
                          - "Brush with olive oil and sprinkle with smoked paprika."
                          - "Bake for 12-15 minutes until salmon is cooked through."
                          - "Broil for the last 1-2 minutes to crisp the edges."
                        image_url: https://storage.googleapis.com/pepesto_recipe_images/c24032ccfaa8768c0a8b686890.webp
                        nutrition:
                          calories: 1884
                          carbohydrates_grams: 4
                          protein_grams: 151
                          fat_grams: 139
                        allergens: [fish]
                        portions: { from: 0, to: 0 }
                        kg_token: Eh4KHFNtb
                      - title: Keto Burger Steak with Mushroom Gravy
                        ingredients:
                          - parsley
                          - 250g button mushrooms
                          - 1 egg
                          - 30g butter
                          - 120ml full-fat cooking cream
                          - 450g ground beef
                          - salt
                          - onion powder
                          - garlic powder
                          - black pepper
                          - beef broth
                          - mustard
                          - worcestershire sauce
                        steps:
                          - "Combine ground beef, egg, onion powder, garlic powder, salt, and pepper. Form into 4 oval patties."
                          - "Brown patties in a skillet for 4-5 minutes per side. Remove and set aside."
                          - "Sauté sliced mushrooms in butter until golden brown."
                          - "Add beef broth, Worcestershire sauce, and Dijon mustard. Simmer to reduce slightly."
                          - "Stir in heavy cream and simmer until gravy thickens."
                          - "Return patties to the pan, spoon gravy over them, and warm through."
                        image_url: https://storage.googleapis.com/pepesto_recipe_images/a41f39a037c17eb720d273d3e1.webp
                        nutrition:
                          calories: 1898
                          carbohydrates_grams: 10
                          protein_grams: 109
                          fat_grams: 157
                        allergens: [eggs, mustard]
                        portions: { from: 1, to: 2 }
                        kg_token: EicKJUtl
                      - title: Creamy Garlic Parmesan Salmon
                        ingredients:
                          - 1/8 lemon
                          - 4 garlic cloves
                          - 60g baby spinach
                          - parsley
                          - 30g butter
                          - 250ml full-fat cooking cream
                          - 50g parmesan cheese
                          - 350g salmon fillet (~1)
                          - olive oil
                          - salt
                          - black pepper
                        steps:
                          - "Pat salmon fillets dry and season with salt and pepper."
                          - "Sear salmon in olive oil in a skillet over medium-high heat for 4-5 minutes per side until golden brown. Remove salmon from pan."
                          - "Melt butter in the same pan over medium heat. Sauté minced garlic for 1 minute until fragrant."
                          - "Reduce heat to low, add heavy cream, and simmer for 2-3 minutes. Stir in parmesan cheese and lemon juice until smooth."
                          - "Add spinach to the sauce and stir until wilted."
                          - "Return salmon to the pan, spoon sauce over it, and simmer for 1 minute. Garnish with parsley."
                        image_url: https://storage.googleapis.com/pepesto_recipe_images/32092390e8bcd31cf77beb3465.webp
                        nutrition:
                          calories: 2043
                          carbohydrates_grams: 17
                          protein_grams: 95
                          fat_grams: 178
                        allergens: [fish]
                        portions: { from: 1, to: 3 }
                        kg_token: Eh1KHUNyZW
                    short_response: "Sure thing! Here are some keto dinner options that are low in carbs and high in protein."

  /products:
    post:
      tags: [Cart]
      summary: Map recipes/ingredients to real supermarket products
      description: |
        Maps one or more recipe `KgToken`s — and an optional manual shopping list — to
        concrete supermarket SKUs with prices, images, and quantities. Items are merged
        across recipes to reduce waste. Each ingredient line returns multiple ranked
        product matches; the first is the recommended pick.
      operationId: products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductsRequest"
            examples:
              weeklyMealPlan:
                summary: Five recipes merged into one Sainsbury's basket
                value:
                  recipe_kg_tokens:
                    - kg_xxx_pizza
                    - kg_xxx_carbonara
                    - kg_xxx_curry
                    - kg_xxx_bolognese
                    - kg_xxx_braisedbeef
                  supermarket_domain: sainsburys.co.uk
              recipeAndManual:
                summary: Recipe + extra items
                value:
                  recipe_kg_tokens:
                    - kg_xxx_zurchergeschnetzeltes
                  supermarket_domain: coop.ch
                  manual_shopping_list: "milk, bananas, kitchen towel"
              historical:
                summary: Same basket priced as of a past date
                value:
                  recipe_kg_tokens: [kg_xxx_carbonara]
                  supermarket_domain: sainsburys.co.uk
                  as_of_date: "2026-04-30"
      responses:
        "200":
          description: Matched product list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
              examples:
                sainsburysBasket:
                  summary: Truncated Sainsbury's basket — three items, varied classifications
                  value:
                    items:
                      - item_name: Parsley
