components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pep_sk
      description: |
        API key minted via `POST /link`. Format: `pep_sk_…`. Pass as
        `Authorization: Bearer pep_sk_…`.

  schemas:
    SupermarketDomain:
      type: string
      description: |
        Domain or stable identifier of the target supermarket. See the table below for
        the 28 supported supermarkets across 13 countries. Need one that isn't here?
        Contact <https://www.pepesto.com/contact>.
      enum:
        - tesco.com
        - sainsburys.co.uk
        - asda.com
        - groceries.morrisons.com
        - waitrose.com
        - ocado.com
        - ah.nl
        - jumbo.com
        - plus.nl
        - shop.rewe.de
        - coop.ch
        - migros.ch
        - aldi-now.ch
        - colruyt.be
        - delhaize.be
        - ah.be
        - tesco.ie
        - shop.supervalu.ie
        - dunnesstoresgrocery.com
        - spesaonline.esselunga.it
        - spesaonline.conad.it
        - nemlig.com
        - meny.no
        - frisco.pl
        - zakupy.auchan.pl
        - ebag.bg
        - handlaprivatkund.ica.se
        - continente.pt
      example: tesco.com

    KgToken:
      type: string
      minLength: 1
      description: Opaque recipe handle returned by `/parse` and `/suggest`. Pass to `/products`.
      example: kg_AbCdEf123

    Currency:
      type: string
      enum: [EUR, GBP, CHF, NOK, PLN, BGN, DKK, SEK]
      example: GBP

    Locale:
      type: string
      description: BCP 47 locale tag.
      example: en-GB

    PriceMinor:
      type: integer
      minimum: 0
      description: Price in the smallest currency unit (e.g. pence, cents, øre).
      example: 199

    Quantity:
      type: object
      description: |
        Quantity per unit. Exactly one field is set depending on how the supermarket
        sells the product (weighed, liquid, by piece, or by bunch).
      properties:
        grams: { type: number, description: Estimated weight per unit in grams. }
        milliliters: { type: number, description: Volume per unit in millilitres. }
        pieces: { type: number, description: Number of pieces per unit. }
        bunches: { type: number, description: Number of bunches per unit. }
      example: { grams: 500 }

    PricePromotion:
      type: object
      properties:
        promo:
          type: boolean
          description: True if the product is currently on promotion.
        promo_percentage:
          type: number
          description: |
            Price discount percentage. May be absent when the promotion is of a different
            type (e.g. "buy 2 get 3").
      example:
        promo: true
        promo_percentage: 25

    Price:
      type: object
      description: |
        Price per unit, in the smallest currency unit of the supermarket's currency
        (e.g. `199` = 1.99 CHF for `coop.ch`).
      properties:
        price: { $ref: "#/components/schemas/PriceMinor" }
        promotion:
          $ref: "#/components/schemas/PricePromotion"
      required: [price]
      example:
        price: 420
        promotion: {}

    ProductClassification:
      type: object
      properties:
        is_bio:
          type: boolean
          description: Certified organic / bio.
        is_frozen: { type: boolean }
        is_substitution:
          type: boolean
          description: Set if Pepesto substituted this match for an unavailable item.
      example: { is_bio: true, is_frozen: false, is_substitution: false }

    IndexedProduct:
      type: object
      description: A real supermarket SKU as indexed by Pepesto.
      properties:
        product_name:
          type: string
          description: Product name in the supermarket's default language.
        category:
          type: string
          description: Product category (e.g. "canned tomatoes", "pasta").
        quantity:
          $ref: "#/components/schemas/Quantity"
        price:
          $ref: "#/components/schemas/Price"
        product_id:
          type: string
          description: |
            Typically the URL of the product page on the supermarket's website.
        image_url:
          type: string
          format: uri
          description: |
            URL of a product image. May end in `.webp`; clients targeting non-webp
            surfaces should skip rendering.
        pepesto_hosted_image_url:
          type: string
          format: uri
          description: |
            The same image hosted by Pepesto rather than the retailer, for clients that
            cannot hotlink to the supermarket's own assets.
        universal_id:
          type: integer
          format: int64
          description: |
            Stable identifier for products sold across multiple supermarket chains
            (lets you compare prices for the same SKU across stores). Populated only
            for packaged products commonly sold in multiple chains.
        classification:
          $ref: "#/components/schemas/ProductClassification"
        session_token:
          type: string
          description: |
            Token to pass to `/session` when adding this product to a checkout cart.

    RecipeNutrition:
      type: object
      description: Whole-recipe nutrition totals.
      properties:
        calories: { type: integer }
        carbohydrates_grams: { type: integer }
        protein_grams: { type: integer }
        fat_grams: { type: integer }

    RecipePortions:
      type: object
      description: "Serving range. `{from: 0, to: 0}` means unknown."
      properties:
        from: { type: integer }
        to: { type: integer }

    RetrievedRecipe:
      type: object
      properties:
        kg_token: { $ref: "#/components/schemas/KgToken" }
        title: { type: string }
        ingredients:
          type: array
          description: Ingredient lines as free-form strings (e.g. "300g flour", "1tsp yeast").
          items: { type: string }
        steps:
          type: array
          description: Cooking steps in order.
          items: { type: string }
        image_url:
          type: string
          format: uri
          description: 1024x1024 WebP image of the recipe. Skip rendering if your surface
            does not support `.webp`.
        nutrition:
          $ref: "#/components/schemas/RecipeNutrition"
        allergens:
          type: array
          description: Allergens detected in the recipe (e.g. `fish`, `eggs`, `mustard`).
          items: { type: string }
        portions:
          $ref: "#/components/schemas/RecipePortions"
      required: [kg_token, title]

    LinkRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address used at Stripe checkout.
        alias:
          type: string
          description: Optional name for this key (useful when minting multiple keys per email).
      required: [email]

    LinkResponse:
      type: object
      properties:
        api_key:
          type: string
          description: The newly minted key. **Returned only once — store immediately.**
          example: pep_sk_…
      required: [api_key]

    CreditsResponse:
      type: object
      properties:
        credits_remaining:
          type: number
          description: Remaining credit balance (in EUR equivalents).
        currency:
          type: string
          example: EUR
      required: [credits_remaining]

    OneshotRequest:
      type: object
      description: |
        At least one of `content_urls`, `content_text`, or `content_image` is required.
      properties:
        content_urls:
          type: array
          items: { type: string, format: uri }
          description: |
            URLs of recipes or shopping lists. Each URL must be reachable with a plain
            HTTP GET — no authentication and no client-side JavaScript. If a page does not
            meet that bar, scrape it yourself and pass the result via `content_text`.
        content_text:
          type: string
          description: Free-form text describing a recipe or shopping list.
        content_image:
          type: string
          format: uri
          description: URL of an image of a recipe or shopping list.
        supermarket_domain:
          allOf:
            - $ref: "#/components/schemas/SupermarketDomain"
          description: |
            Target supermarket. Optional — if omitted, Pepesto picks one based on the
            user's location.

    OneshotResponse:
      type: object
      properties:
        redirect_url:
          type: string
          format: uri
          description: |
            Link to the Pepesto-hosted result page (under `https://s.pepesto.com`) showing
            the matched products. Open it in a browser or embed it in your site/app as an
            iframe via the Pepesto widget:

            ```html
            <div id="pepesto-widget-container"></div>
            <script src="https://s.pepesto.com/get_recipe.js"
                    data-source-url="REDIRECT_URL_RETURNED_BY_THE_SHOPPING_API"></script>
            ```
      required: [redirect_url]

    PredirectRequest:
      type: object
      properties:
        shopping_list:
          type: string
          description: |
            Free-form shopping list. It may run over several lines and may name at most
            30 ingredients.
        locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          description: The user's locale (e.g. `de-DE`).
      required: [shopping_list]

    PredirectResponse:
      type: object
      properties:
        redirect_url:
          type: string
          format: uri
          description: |
            Deferred deep link to the Pepesto mobile app. Opening it starts the parse and
            match of the shopping list sent in the request.
      required: [redirect_url]

    ParseRequest:
      type: object
      description: Provide exactly one of `recipe_url` or `recipe_text`.
      properties:
        recipe_url:
          type: string
          format: uri
          description: Publicly crawlable recipe URL.
        recipe_text:
          type: string
          description: Free-form recipe text.
        locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          default: en-GB
          description: BCP 47 locale to translate the parsed recipe into. Defaults to `en-GB`.
        generate_image:
          type: boolean
          default: false
          description: If true, generate a 1024x1024 image suitable for the parsed recipe.

    ParseResponse:
      type: object
      properties:
        recipe: { $ref: "#/components/schemas/RetrievedRecipe" }
      required: [recipe]

    Personalization:
      type: object
      description: |
        Optional preferences to tailor recipe retrieval. Stored on the API key for
        future calls.
      properties:
        locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          default: en-UK
          description: BCP 47 locale to translate the recipes into. Defaults to `en-UK`.
        portions:
          type: integer
          default: 3
          description: Number of people the recipes should serve. Recipes are scaled
            accordingly. Defaults to 3.
        supermarket_domain:
          allOf:
            - $ref: "#/components/schemas/SupermarketDomain"
          description: Preferred supermarket. Used to prioritise recipes whose
            ingredients are available at that store or currently on promotion.

    SuggestRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: |
            Free-text query that may include cuisine, dietary tags, ingredients to include
            or avoid, time constraints, and servings.
        personalization:
          $ref: "#/components/schemas/Personalization"
      required: [query]

    SuggestResponse:
      type: object
      description: Always returns 3 recipes plus a short natural-language reply.
      properties:
        recipes:
          type: array
          items: { $ref: "#/components/schemas/RetrievedRecipe" }
        short_response:
          type: string
          description: |
            Short, human-readable reply to the user's query, localised to the user's
            language. For multi-turn search, append this to the next request's `query`.
      required: [recipes]

    ProductMatch:
      type: object
      description: |
        A concrete product offered for an ingredient line, with a suggested quantity to
        buy. The list inside `ItemMatch.products` is sorted: the first item is the
        recommended pick.
      properties:
        product: { $ref: "#/components/schemas/IndexedProduct" }
        session_token:
          type: string
          description: |
            Token to pass to `/session` when adding this product to a checkout cart.
        num_units_to_buy:
          type: integer
          minimum: 0
          description: |
            Number of units to buy. `0` means "checklist item" — Pepesto does not
            suggest buying it by default, but surfaces it in the UI as a reminder
            (useful for pantry staples like salt).

    ItemMatch:
      type: object
      description: |
        One ingredient line and the ranked products offered for it. Sorting accounts for
        user preferences and past purchases, food-waste / cost minimisation, bio /
        quality preference, and product reviews. An empty `products` array means no
        suitable match was found in the index — the Pepesto UI may still offer
        alternatives at checkout.
      properties:
        item_name:
          type: string
          description: Normalised ingredient name (e.g. "olive oil").
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductMatch" }

    ProductsRequest:
      type: object
      properties:
        recipe_kg_tokens:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/KgToken" }
          description: Tokens from `/parse` or `/suggest`.
        manual_shopping_list:
          type: string
          maxLength: 5000
          description: |
            Free-text shopping list (e.g. "4 eggs, pasta, 2 chicken breasts"). Max 5000
            characters.
        supermarket_domain:
          allOf:
            - $ref: "#/components/schemas/SupermarketDomain"
          description: |
            Target supermarket. Optional — if omitted, Pepesto picks one based on the
            user's location.
        user_id:
          type: string
          description: |
            Personalisation handle used to tailor offered products to the user's
            preferences (e.g. allergies, past purchases).
        item_names_locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          description: BCP 47 locale to display item names in (e.g. `de-DE`).
        as_of_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            `YYYY-MM-DD` — query historical prices and matches as of this date.
            Pepesto tracks history from **2026-04-29** onwards; earlier dates are not
            available. Omit for current data.
      required: [recipe_kg_tokens]

    ProductsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemMatch" }
        missing_items:
          type: array
          items: { type: string }
          description: |
            Requested items for which no suitable match was found — either absent from
            the index, or unavailable at the chosen supermarket.
        currency: { $ref: "#/components/schemas/Currency" }

    SearchRequest:
      type: object
      properties:
        product:
          type: string
          description: |
            Free-text description of what to look for (e.g. "organic strawberries 500g,
            H-Milch 3.5% 1L, free-range eggs 10-pack").
        supermarket_domain: { $ref: "#/components/schemas/SupermarketDomain" }
        webhook_url:
          type: string
          format: uri
          description: |
            Called with an HTTP POST and an empty body once the search is finished.
            Pepesto appends the session id as a `sid` query parameter.
      required: [product, supermarket_domain]

    SearchResponse:
      type: object
      properties:
        search_session_id:
          type: string
          description: Pass to `/retrieve` to check the search and collect its results.
      required: [search_session_id]

    RetrieveRequest:
      type: object
      properties:
        search_session_id:
          type: string
          description: The id returned by `/search`.
      required: [search_session_id]

    RetrieveResponse:
      type: object
      properties:
        status:
          type: string
          enum: [queued, in_progress, done]
          description: |
            `queued` means accepted but not started, `in_progress` means running, and
            `done` means the results are in `items`.
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemMatch" }
          description: |
            Only present once `status` is `done`. Holds exactly as many entries as the
            original `/search` request asked for.
        currency: { $ref: "#/components/schemas/Currency" }
      required: [status]

    Sku:
      type: object
      properties:
        session_token:
          type: string
          description: From `ProductMatch.session_token` in `/products` response.
        num_units_to_buy:
          type: integer
          minimum: 0
      required: [session_token, num_units_to_buy]

    SessionRequest:
      type: object
      properties:
        supermarket_domain: { $ref: "#/components/schemas/SupermarketDomain" }
        user_locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          description: BCP 47 locale used by Pepesto's checkout agent.
        redirect_url:
          type: string
          format: uri
          description: |
            Where to send the user once checkout is done. Used by `/mcheckout`, which
            appends the supermarket's cart URL as the escaped `cartUrl` query parameter.
            Leave it out and the user stays on the supermarket's cart or login page.
        skus:
          type: array
          items: { $ref: "#/components/schemas/Sku" }
          description: |
            SKUs returned by `/products` (one entry per `session_token` you want in the
            cart). Provide `skus`, `unresolved_items`, or both.
        unresolved_items:
          type: array
          items: { type: string }
          description: |
            Free-text items that have not been matched to concrete SKUs. The Pepesto
            checkout agent will search for these on the supermarket's site at run time.
        charge_user:
          type: boolean
          description: |
            If true, the end user is billed directly for session creation instead of
            consuming this API key's credits. Pepesto creates a hosted payment link
            and returns it as `payment_redirect_url`. The session is only ready for
            checkout once the user completes payment — wait for `charge_user_webhook`
            (if set) before driving `/checkout`.

            The user is charged in the supermarket's local currency.
        charge_user_amount:
          type: number
          format: float
          description: |
            Extra amount in **euros** added on top of Pepesto's base session price when
            `charge_user` is true. The base + extra is collected from the user;
            the extra is credited back to this API key (cashable on request — contact
            support@pepesto.com). Pepesto converts to the supermarket's currency at
            redirect time.
        charge_user_webhook:
          type: string
          format: uri
          description: |
            URL Pepesto calls after a successful user payment to signal that the session
            is ready. Only meaningful when `charge_user` is true.
      required: [supermarket_domain]

    SessionResponse:
      type: object
      properties:
        session_id:
          type: string
          description: |
            Always returned. Feed it to `/checkout` to drive the supermarket's site.
            When `charge_user` was true in the request, the session exists but is not
            ready until the user has paid — wait for the `charge_user_webhook` callback.
        payment_redirect_url:
          type: string
          format: uri
          description: |
            Hosted payment link to redirect the user to. Returned only when
            `charge_user` was set to true in the request.
        mobile_hosted_url:
          type: string
          format: uri
          description: |
            Deferred deep link to the Pepesto mobile app, returned by `/mcheckout`. Send
            the user there and the app runs the checkout loop for this session.
      required: [session_id]

    PrevTurnResponse:
      type: object
      description: |
        Outcome of whatever the client did on the previous turn — running JS in a
        browser, performing a native action on iOS, calling an HTTP service from
        a server agent, prompting a user in a chat surface, etc. The `result` /
        `error` pair is the lowest-common-denominator shape; richer instruction
        kinds may extend it with extra fields.

        A non-empty `error` means failure — the server prefers `error` over
        `result` in that case.
      properties:
        result:
          type: string
          description: |
            String result of the previous action on success (e.g. a JS return
            value, a native call's payload, a server-side response).
        error:
          type: string
          description: |
            Description of why the previous action failed (exception, timeout,
            user cancellation, etc.). When non-empty, the server treats the turn
            as failed regardless of `result`.
      additionalProperties: true

    JavaScriptSpec:
      type: object
      description: |
        Instruction payload for a browser-style `run_js` turn. Other client
        kinds (iOS, server agent, chat, …) receive their own instruction
        payloads under their own keys in `proto`.

        The client evaluates `js` (which defines a function named `func`), then
        invokes that function with no arguments and stringifies its return value
        into `PrevTurnResponse.result` on the next turn.
      properties:
        js:
          type: string
          description: JavaScript source defining the entry function.
        func:
          type: string
          description: Name of the entry function to invoke (may be `async`).
        max_execute_time_msec:
          type: integer
          description: |
            Execution timeout in milliseconds. If `0` or omitted, the client
            should default to **100000** (100 seconds).
      required: [js, func]

    CheckoutRequest:
      type: object
      description: |
        External clients **never** create checkout sessions via this API. Always
        start from a `continue_session_id` obtained out-of-band (e.g. from
        `/session` or the Pepesto app), and echo it on every subsequent call for
        the same session.
      properties:
        continue_session_id:
          type: string
          description: ID of the active driver session to advance.
        prev_turn_response:
          allOf:
            - $ref: "#/components/schemas/PrevTurnResponse"
          description: |
            Outcome of the action the client performed in response to the
            previous turn's instruction. Omit on the very first turn, or when
            the previous instruction did not require a result.
        screenshot:
          type: string
          format: byte
          description: |
            Base64-encoded screenshot of the client surface after executing the
            previous instruction. Attach when the previous response had
            `attach_screenshot_on_next_turn: true`. Applicable only to client
            kinds that have a visual surface (browser, iOS, …).
      required: [continue_session_id]

    NextCheckoutIterationProto:
      type: object
      description: |
        Server's instruction for this turn. Carries the session id, an optional
        screenshot request, and exactly one instruction payload — keyed by
        client kind (e.g. `run_js` for browsers, with iOS / server-agent / chat
        kinds getting their own keys). Only `run_js` is fully documented today;
        other instruction payloads are passed through verbatim.
      properties:
        session_id:
          type: string
          description: The session that was advanced.
        attach_screenshot_on_next_turn:
          type: boolean
          description: |
            If true, the client should attach a screenshot of its surface as
            `screenshot` on the next `/checkout` request.
        run_js:
          $ref: "#/components/schemas/JavaScriptSpec"
      required: [session_id]
      additionalProperties: true

    CheckoutResponse:
      type: object
      properties:
        proto:
          $ref: "#/components/schemas/NextCheckoutIterationProto"
      required: [proto]

    CatalogRequest:
      type: object
      properties:
        supermarket_domain: { $ref: "#/components/schemas/SupermarketDomain" }
      required: [supermarket_domain]

    CatalogQuantity:
      type: object
      description: |
        Structured pack size. The `Unit` discriminator carries exactly one of
        `HundredGrams`, `Pieces`, or `Milliliters`. `accurate_grams` is set
        alongside `Unit.HundredGrams` when the supermarket lists a non-rounded
        weight (e.g. a 340 g pack rounds to `HundredGrams: 3` but
        `accurate_grams: 340`).
      properties:
        Unit:
          type: object
          additionalProperties: false
          properties:
            HundredGrams:
              type: integer
              description: Pack weight in 100-gram units (e.g. `5` = 500 g).
            Pieces:
              type: integer
            Milliliters:
              type: integer
        accurate_grams:
          type: integer
          description: Exact pack weight in grams when known.
      required: [Unit]

    CatalogProduct:
      type: object
      description: |
        One indexed product. Returned by both `/catalog` (full dump) and
        `/promotions` (subset with `promo: true`). All optional fields are best
        effort and may be absent depending on the supermarket.
      properties:
        entity_name:
          type: string
          description: Pepesto's normalised category (e.g. "Grapes", "Tortillas").
        names:
          type: object
          description: |
            Localised display names. Keys are language codes; `en` is provided
            as a fallback alongside the supermarket's primary locale.
          additionalProperties:
            type: string
          example:
            en: AH Red seedless grapes
            nl: AH Rode druiven pitloos
        price: { $ref: "#/components/schemas/PriceMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        promo:
          type: boolean
          description: |
            True when the product is currently on promotion. Always `true` on
            `/promotions`; may be `true` or omitted on `/catalog`.
        quantity_str:
          type: string
          description: |
            Human-readable pack size as shown on the supermarket page
            (e.g. "500g", "1 piece", "1 l").
        quantity:
          $ref: "#/components/schemas/CatalogQuantity"
        price_per_meausure_unit:
          type: string
          description: |
            Free-form per-measure-unit price string sourced from the supermarket
            (e.g. `"2.15 CHF / 100g"`, `"1.40 / 100g"`). **Note:** the field name
            is misspelled on the wire (`meausure` instead of `measure`); the
            spec preserves the wire spelling.
        self_hosted_image:
          type: string
          format: uri
          description: |
            Pepesto-hosted product image (`.webp`, under
            `https://storage.googleapis.com/pepesto_recipe_images/`). Skip
            rendering if your surface does not support `.webp`.
        tags:
          type: array
          items: { type: string }
          description: |
            Free-form tags surfaced by the supermarket (e.g. `bio`, `canned`,
            `gluten-free`, `frozen`).
      required: [entity_name, names, price, currency]

    CatalogResponse:
      type: object
      properties:
        parsed_products:
          type: object
          description: |
            Map keyed by the canonical product URL on the supermarket's site.
            Values are the parsed catalog entries.
          additionalProperties:
            $ref: "#/components/schemas/CatalogProduct"
      required: [parsed_products]

    PromotionsRequest:
      type: object
      properties:
        supermarket_domain: { $ref: "#/components/schemas/SupermarketDomain" }
      required: [supermarket_domain]

    PromotionsResponse:
      type: object
      description: |
        Same shape as `CatalogResponse`, filtered to products currently on
        promotion. All entries have `promo: true`.
      properties:
        parsed_products:
          type: object
          description: |
            Map keyed by the canonical product URL on the supermarket's site.
            Values are `CatalogProduct` entries with `promo: true`.
          additionalProperties:
            $ref: "#/components/schemas/CatalogProduct"
      required: [parsed_products]
