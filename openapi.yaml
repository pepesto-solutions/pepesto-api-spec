                              image_url: https://assets.sainsburys-groceries.co.uk/gol/445887/image.jpg
                              classification: {}
                              session_token: tok_parsley_a
                            session_token: tok_parsley_a
                            num_units_to_buy: 1
                          - product:
                              product_name: Sainsbury's Fresh Living Flat Leaf Parsley Pot
                              quantity: { pieces: 1 }
                              price:
                                price: 135
                                promotion:
                                  promo: true
                                  promo_percentage: 15
                              product_id: https://www.sainsburys.co.uk/gol-ui/product/sainsbury-s-fresh-living-flat-leaf-parsley-pot
                              image_url: https://assets.sainsburys-groceries.co.uk/gol/6034606/image.jpg
                              classification: { is_bio: false, is_frozen: false, is_substitution: false }
                              session_token: tok_parsley_b
                            session_token: tok_parsley_b
                            num_units_to_buy: 1
                      - item_name: Oregano
                        products:
                          - product:
                              product_name: Stamford Street Co. Oregano 18g
                              quantity: { grams: 18 }
                              price:
                                price: 80
                                promotion: {}
                              product_id: https://www.sainsburys.co.uk/gol-ui/product/stamford-street-co-oregano-18g
                              image_url: https://assets.sainsburys-groceries.co.uk/gol/8191679/image.jpg
                              classification: { is_substitution: true }
                              session_token: tok_oregano_a
                            session_token: tok_oregano_a
                      - item_name: Butter
                        products:
                          - product:
                              product_name: Yeo Valley Organic Unsalted Butter 200g
                              quantity: { grams: 200 }
                              price:
                                price: 225
                                promotion:
                                  promo: true
                                  promo_percentage: 27
                              product_id: https://www.sainsburys.co.uk/gol-ui/product/yeo-valley-organic-unsalted-butter-200g
                              image_url: https://assets.sainsburys-groceries.co.uk/gol/8161458/image.jpg
                              classification: { is_bio: true }
                              session_token: tok_butter_a
